<!doctype html>
<html ⚡ lang="hi">
  <head>
    <meta charset="utf-8">
    <title>अपनी स्टोरी का मुख्य टाइटल यहाँ लिखें</title>
    <link rel="canonical" href="./story2.html">
    <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">
    
    <script async src="https://cdn.ampproject.org/v0.js"></script>
    <script async custom-element="amp-story" src="https://cdn.ampproject.org/v0/amp-story-1.0.js"></script>
    
    <style amp-boilerplate>body{-webkit-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-moz-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-ms-animation:-amp-start 8s steps(1,end) 0s 1 normal both;animation:-amp-start 8s steps(1,end) 0s 1 normal both}@-webkit-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-moz-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-ms-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-o-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}</style><noscript><style amp-boilerplate>body{-webkit-animation:none;-moz-animation:none;-ms-animation:none;animation:none}</style></noscript>
    
    <style amp-custom>
      amp-story { font-family: 'Mukta', sans-serif; color: #ffffff; }
      .card-box { background: rgba(0, 0, 0, 0.78); padding: 16px; border-radius: 8px; margin: 16px; }
      .card-box h1, .card-box h2 { font-size: 20px; margin: 0 0 6px 0; }
      .card-box p { font-size: 14px; margin: 0; color: #e5e5e5; }
      .btn { display: inline-block; background: #007bff; color: #fff !important; padding: 8px 16px; border-radius: 20px; text-decoration: none; margin-top: 10px; font-weight: bold; font-size: 13px; }
    </style>
  </head>
  <body>
    <!-- पोस्टर इमेज (640x853) और पब्लिशर जानकारी -->
    <amp-story standalone
               title="अपनी स्टोरी का मुख्य टाइटल यहाँ लिखें"
               publisher="Study Mirror"
               publisher-logo-src="https://picsum.photos/96/96"
               poster-portrait-src="https://picsum.photos/640/853">

      <!-- स्लाइड 1 -->
      <amp-story-page id="slide-1">
        <amp-story-grid-layer template="fill">
          <amp-img src="अपनी पहली इमेज का लिंक यहाँ डालें (720x1280)" width="720" height="1280" layout="responsive" alt="Image 1"></amp-img>
        </amp-story-grid-layer>
        <amp-story-grid-layer template="vertical" class="bottom">
          <div class="card-box">
            <h1>स्लाइड 1 की हेडिंग</h1>
            <p>यहाँ पहली स्लाइड का संक्षिप्त विवरण लिखें।</p>
          </div>
        </amp-story-grid-layer>
      </amp-story-page>

      <!-- स्लाइड 2 -->
      <amp-story-page id="slide-2">
        <amp-story-grid-layer template="fill">
          <amp-img src="अपनी दूसरी इमेज का लिंक यहाँ डालें (720x1280)" width="720" height="1280" layout="responsive" alt="Image 2"></amp-img>
        </amp-story-grid-layer>
        <amp-story-grid-layer template="vertical" class="bottom">
          <div class="card-box">
            <h2>स्लाइड 2 की हेडिंग</h2>
            <p>यहाँ दूसरा मुख्य बिंदु लिखें।</p>
          </div>
        </amp-story-grid-layer>
      </amp-story-page>

      <!-- अंतिम स्लाइड (कॉल-टू-एक्शन बटन वाली) -->
      <amp-story-page id="slide-last">
        <amp-story-grid-layer template="fill">
          <amp-img src="अपनी अंतिम इमेज का लिंक यहाँ डालें (720x1280)" width="720" height="1280" layout="responsive" alt="Image Final"></amp-img>
        </amp-story-grid-layer>
        <amp-story-grid-layer template="vertical" class="bottom">
          <div class="card-box">
            <h2>पूरी खबर विस्तार से पढ़ें</h2>
            <p>आधिकारिक नोटिस और संपूर्ण विवरण देखने के लिए नीचे क्लिक करें।</p>
            <!-- अपनी ब्लॉगर पोस्ट का लिंक नीचे href में डालें -->
            <a href="https://yourblog.blogspot.com/post-url.html" target="_blank" class="btn">पूरी पोस्ट पढ़ें &rarr;</a>
          </div>
        </amp-story-grid-layer>
      </amp-story-page>

    </amp-story>
  </body>
</html>
