<!doctype html>
<html ⚡ lang="hi">
  <head>
    <meta charset="utf-8">
    <title>मेरी पहली वेब स्टोरी</title>
    <link rel="canonical" href="./story1.html">
    <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">
    
    <script async src="https://cdn.ampproject.org/v0.js"></script>
    <script async custom-element="amp-story" src="https://cdn.ampproject.org/v0/amp-story-1.0.js"></script>
    
    <style amp-boilerplate>body{-webkit-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-moz-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-ms-animation:-amp-start 8s steps(1,end) 0s 1 normal both;animation:-amp-start 8s steps(1,end) 0s 1 normal both}@-webkit-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-moz-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-ms-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-o-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}</style><noscript><style amp-boilerplate>body{-webkit-animation:none;-moz-animation:none;-ms-animation:none;animation:none}</style></noscript>
    
    <style amp-custom>
      amp-story {
        font-family: sans-serif;
        color: #ffffff;
      }
      .card-box {
        background: rgba(0, 0, 0, 0.75);
        padding: 16px;
        border-radius: 8px;
        margin: 16px;
      }
      .card-box h1, .card-box h2 {
        font-size: 20px;
        margin: 0 0 6px 0;
      }
      .card-box p {
        font-size: 14px;
        margin: 0;
        color: #e5e5e5;
      }
      .btn {
        display: inline-block;
        background: #007bff;
        color: #fff !important;
        padding: 8px 16px;
        border-radius: 20px;
        text-decoration: none;
        margin-top: 10px;
        font-weight: bold;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <amp-story standalone
               title="मेरी पहली वेब स्टोरी"
               publisher="Study Mirror"
               publisher-logo-src="https://picsum.photos/96/96"
               poster-portrait-src="https://picsum.photos/640/853">

      <!-- Slide 1 -->
      <amp-story-page id="slide-1">
        <amp-story-grid-layer template="fill">
          <amp-img src="https://picsum.photos/720/1280?image=1062" width="720" height="1280" layout="responsive" alt="Image 1"></amp-img>
        </amp-story-grid-layer>
        <amp-story-grid-layer template="vertical" class="bottom">
          <div class="card-box">
            <h1>स्लाइड 1: मुख्य हेडिंग</h1>
            <p>आपकी पहली वेब स्टोरी तैयार है। आगे बढ़ने के लिए स्क्रीन पर टैप करें।</p>
          </div>
        </amp-story-grid-layer>
      </amp-story-page>

      <!-- Slide 2 -->
      <amp-story-page id="slide-2">
        <amp-story-grid-layer template="fill">
          <amp-img src="https://picsum.photos/720/1280?image=1069" width="720" height="1280" layout="responsive" alt="Image 2"></amp-img>
        </amp-story-grid-layer>
        <amp-story-grid-layer template="vertical" class="bottom">
          <div class="card-box">
            <h2>स्लाइड 2: मुख्य बिंदु</h2>
            <p>यहाँ आप अपनी परीक्षा, रिजल्ट या भर्ती से जुड़ी जरूरी बातें लिख सकते हैं।</p>
          </div>
        </amp-story-grid-layer>
      </amp-story-page>

      <!-- Slide 3 -->
      <amp-story-page id="slide-3">
        <amp-story-grid-layer template="fill">
          <amp-img src="https://picsum.photos/720/1280?image=1074" width="720" height="1280" layout="responsive" alt="Image 3"></amp-img>
        </amp-story-grid-layer>
        <amp-story-grid-layer template="vertical" class="bottom">
          <div class="card-box">
            <h2>पूरी खबर विस्तार से पढ़ें</h2>
            <p>ऑफिशियल नोटिस और आवेदन के लिए नीचे दिए गए बटन पर क्लिक करें।</p>
            <a href="https://yourblog.blogspot.com" target="_blank" class="btn">वेबसाइट पर जाएं &rarr;</a>
          </div>
        </amp-story-grid-layer>
      </amp-story-page>

    </amp-story>
  </body>
</html>
